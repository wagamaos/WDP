<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Homework</title>
    <style>
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #4b5563;
        --accent: #7c3aed;
        --accent-soft: #ede9fe;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #f5f3ff, #f8fafc);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
      }
      .card {
        max-width: 760px;
        background: var(--card);
        border-radius: 20px;
        box-shadow: 0 18px 45px rgba(124, 58, 237, 0.12);
        padding: 40px 32px;
      }
      .tag {
        display: inline-block;
        background: var(--accent-soft);
        color: var(--accent);
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        margin: 18px 0 12px;
        font-size: clamp(2rem, 4vw, 3rem);
      }
      p {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.7;
        font-size: 1.05rem;
      }
      a {
        display: inline-block;
        background: var(--accent);
        color: white;
        text-decoration: none;
        padding: 14px 22px;
        border-radius: 12px;
        font-weight: 700;
        margin-top: 12px;
      }
      a:hover {
        filter: brightness(1.06);
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .report {
        margin-top: 32px;
      }
      .report h2 {
        font-size: 1.25rem;
      }
      .report-frame {
        width: 100%;
        height: 720px;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        background: white;
      }
      @media (max-width: 600px) {
        body {
          padding: 16px;
        }
        .card {
          padding: 28px 20px;
        }
        .report-frame {
          height: 560px;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="tag">Week 10</div>
      <h1>Portfolio Homework</h1>
      <p>
        This homework is to review and submit the GitHub portfolio repository for the project.
      </p>
      <p>
        Visit the published portfolio or explore its GitHub repository:
      </p>
      <div class="links">
        <a href="https://wagamaos.github.io/portfolio/" target="_blank" rel="noopener noreferrer">
          View Live Portfolio
        </a>
        <a href="https://github.com/wagamaos/portfolio" target="_blank" rel="noopener noreferrer">
          Open Portfolio GitHub Repo
        </a>
        <a href="Lighthouse_Accessibility_Report.docx" download>
          Download Lighthouse Report (Word)
        </a>
      </div>
      <section class="report" aria-labelledby="report-heading">
        <h2 id="report-heading">Lighthouse Accessibility Report</h2>
        <iframe
          class="report-frame"
          src="Lighthouse_Accessibility_Report.html"
          title="Lighthouse Accessibility Report">
        </iframe>
      </section>
    </main>
  </body>
</html>
