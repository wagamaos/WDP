<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio Gallery — React Demo</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; color: #e5e7eb; background: #0b1020; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 48px 20px; background: radial-gradient(ellipse at 18% 0%, #312e8170, transparent 38rem), #0b1020; }
    main { width: min(1050px, 100%); margin: auto; }
    header { margin-bottom: 32px; text-align: center; }
    .eyebrow { color: #a5b4fc; font-size: .75rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1, h2, h3 { letter-spacing: -.04em; }
    h1 { margin: 8px 0; color: white; font-size: clamp(2.4rem, 7vw, 4.4rem); }
    header p { color: #a5afc3; }
    .gallery { padding: clamp(18px, 4vw, 30px); border: 1px solid #ffffff20; border-radius: 20px; background: #111827d9; }
    .gallery-heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    .gallery-heading h2 { margin: 0; }
    .filter { display: grid; gap: 6px; min-width: 190px; color: #a5afc3; font-size: .85rem; }
    select { min-height: 42px; padding: 0 12px; border: 1px solid #39445b; border-radius: 9px; background: #171f31; color: #f8fafc; font: inherit; }
    .project-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .project-card { display: flex; min-height: 260px; flex-direction: column; justify-content: space-between; padding: 20px; border: 1px solid #ffffff20; border-radius: 15px; background: linear-gradient(155deg, #1d273b, #121a2b 68%); }
    .project-card h3 { margin: 0; color: #f8fafc; }
    .project-card p { color: #a5afc3; line-height: 1.6; }
    .tech-list { display: flex; flex-wrap: wrap; gap: 7px; margin: 0; padding: 0; list-style: none; }
    .tech-tag { padding: 5px 9px; border: 1px solid #818cf855; border-radius: 999px; background: #6366f126; color: #c7d2fe; font-size: .75rem; }
    .project-links { display: flex; gap: 9px; margin-top: 20px; }
    .project-links a { flex: 1; padding: 9px; border: 1px solid #39445b; border-radius: 8px; color: #dbeafe; font-size: .82rem; font-weight: 700; text-align: center; text-decoration: none; }
    .project-links a:hover, a:focus-visible { border-color: #a5b4fc; outline-offset: 3px; }
    .empty { grid-column: 1 / -1; color: #a5afc3; text-align: center; }
    .count { margin: 18px 0 0; color: #8793aa; font-size: .85rem; text-align: right; }
    @media (max-width: 760px) { .project-list { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 560px) { .gallery-heading { align-items: stretch; flex-direction: column; } .project-list { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">Week 11 · Homework demo</div>
      <h1>Project Gallery</h1>
      <p>Filter real project cards by technology.</p>
    </header>
    <div id="root"></div>
  </main>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script>
    const h = React.createElement;
    const projects = [
      {
        id: 'portfolio',
        title: 'Personal Portfolio',
        description: 'A personal site introducing my work and presenting selected projects.',
        techStack: ['HTML', 'CSS', 'JavaScript'],
        githubUrl: 'https://github.com/wagamaos/portfolio',
        demoUrl: 'https://wagamaos.github.io/portfolio/'
      },
      {
        id: 'landed',
        title: 'Landed Campus Companion',
        description: 'A gamified campus companion for student quests, events, rewards, and budgeting.',
        techStack: ['HTML', 'CSS', 'JavaScript'],
        githubUrl: 'https://github.com/wagamaos/WDP_Project',
        demoUrl: 'https://wagamaos.github.io/WDP_Project/'
      },
      {
        id: 'book-search',
        title: 'Book Search',
        description: 'Search the Open Library catalogue and browse responsive book results.',
        techStack: ['HTML', 'CSS', 'JavaScript', 'REST API'],
        githubUrl: 'https://github.com/wagamaos/WDP/tree/main/Week%207',
        demoUrl: 'https://wagamaos.github.io/WDP/Week%207/Booksearch.html'
      }
    ];

    function ProjectCard({ project }) {
      return h('article', { className: 'project-card' },
        h('div', null,
          h('h3', null, project.title),
          h('p', null, project.description),
          h('ul', { className: 'tech-list', 'aria-label': `${project.title} technologies` },
            project.techStack.map((technology) =>
              h('li', { className: 'tech-tag', key: technology }, technology)
            )
          )
        ),
        h('div', { className: 'project-links' },
          h('a', { href: project.githubUrl, target: '_blank', rel: 'noreferrer' }, 'GitHub ↗'),
          h('a', { href: project.demoUrl, target: '_blank', rel: 'noreferrer' }, 'Live demo ↗')
        )
      );
    }

    function ProjectList({ projects }) {
      if (projects.length === 0) {
        return h('p', { className: 'empty' }, 'No projects use that technology yet.');
      }
      return h('div', { className: 'project-list' },
        projects.map((project) => h(ProjectCard, { project, key: project.id }))
      );
    }

    function FilterBar({ technologies, selectedTechnology, onTechnologyChange }) {
      return h('label', { className: 'filter' },
        'Filter by technology',
        h('select', {
          value: selectedTechnology,
          onChange: (event) => onTechnologyChange(event.target.value)
        },
          h('option', { value: 'all' }, 'All technologies'),
          technologies.map((technology) =>
            h('option', { value: technology, key: technology }, technology)
          )
        )
      );
    }

    function App() {
      const [selectedTechnology, setSelectedTechnology] = React.useState('all');
      const technologies = [...new Set(projects.flatMap((project) => project.techStack))].sort();
      const filteredProjects = selectedTechnology === 'all'
        ? projects
        : projects.filter((project) => project.techStack.includes(selectedTechnology));

      return h('section', { className: 'gallery' },
        h('div', { className: 'gallery-heading' },
          h('div', null, h('p', { className: 'eyebrow' }, 'Portfolio'), h('h2', null, 'Featured projects')),
          h(FilterBar, { technologies, selectedTechnology, onTechnologyChange: setSelectedTechnology })
        ),
        h(ProjectList, { projects: filteredProjects }),
        h('p', { className: 'count', 'aria-live': 'polite' },
          `Showing ${filteredProjects.length} ${filteredProjects.length === 1 ? 'project' : 'projects'}`
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
</html>
