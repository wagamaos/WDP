<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - JavaScript Validation</title>
    <link rel="stylesheet" href="homework.css">
</head>

<body>
    <h1>Student Registration Form</h1>

    <form id="reg-form" action="/register" method="POST" novalidate>
        <fieldset>
            <legend>Student Info</legend>

            <label for="sname">Full Name</label>
            <input type="text" id="sname" name="sname" required minlength="2" maxlength="50"
                placeholder="Enter full name" aria-describedby="sname-error" aria-invalid="false">
            <span id="sname-error" class="error" aria-live="polite"></span>

            <label for="sid">Student ID</label>
            <input type="text" id="sid" name="sid" required pattern="\d{9}" title="Enter a 9-digit number"
                placeholder="123456789" aria-describedby="sid-error" aria-invalid="false">
            <span id="sid-error" class="error" aria-live="polite"></span>

            <label for="semail">Gachon Email</label>
            <input type="email" id="semail" name="semail" required placeholder="name@example.com"
                aria-describedby="semail-error" aria-invalid="false">
            <span id="semail-error" class="error" aria-live="polite"></span>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="8"
                placeholder="At least 8 characters" aria-describedby="password-error" aria-invalid="false">
            <span id="password-error" class="error" aria-live="polite"></span>

            <label for="confirm">Confirm Password</label>
            <input type="password" id="confirm" name="confirm" required placeholder="Re-enter password"
                aria-describedby="confirm-error" aria-invalid="false">
            <span id="confirm-error" class="error" aria-live="polite"></span>
        </fieldset>

        <button type="submit" id="submit-btn" disabled>Submit</button>
        <div id="success" role="status" aria-live="polite"></div>
    </form>

    <script>
        const form = document.getElementById("reg-form");
        const submitBtn = document.getElementById("submit-btn");
        const success = document.getElementById("success");

        const fields = [
            document.getElementById("sname"),
            document.getElementById("sid"),
            document.getElementById("semail"),
            document.getElementById("password"),
            document.getElementById("confirm")
        ];

        const password = document.getElementById("password");
        const confirm = document.getElementById("confirm");

        function validatePassword() {
            if (confirm.value === "") {
                confirm.setCustomValidity("");
            } else if (confirm.value !== password.value) {
                confirm.setCustomValidity("Passwords do not match.");
            } else {
                confirm.setCustomValidity("");
            }
        }

        function showError(field) {
            const error = document.getElementById(field.id + "-error");
            const messages = {
                sname: "Please enter a name between 2 and 50 characters.",
                sid: "Student ID must contain exactly 9 digits.",
                semail: "Please enter a valid email address.",
                password: "Password must contain at least 8 characters.",
                confirm: "Passwords must match."
            };

            if (field.validity.valid) {
                error.textContent = "";
                field.setAttribute("aria-invalid", "false");
            } else {
                if (field.validity.valueMissing) {
                    error.textContent = "This field is required.";
                } else if (field.validity.typeMismatch) {
                    error.textContent = messages[field.id];
                } else if (field.validity.patternMismatch) {
                    error.textContent = messages[field.id];
                } else if (field.validity.tooShort ||
                    field.validity.tooLong) {
                    error.textContent = messages[field.id];
                } else if (field.validity.customError) {
                    error.textContent = messages[field.id];
                } else {
                    error.textContent = messages[field.id];
                }

                field.setAttribute("aria-invalid", "true");
            }
        }

        function updateForm() {
            validatePassword();
            fields.forEach(showError);
            submitBtn.disabled = !form.checkValidity();
        }

        fields.forEach(function (field) {
            field.addEventListener("input", function () {
                success.textContent = "";
                updateForm();
            });
        });

        form.addEventListener("submit", function (event) {
            event.preventDefault();
            updateForm();

            if (!form.checkValidity()) {
                const firstInvalid = fields.find(
                    field => !field.validity.valid
                );
                if (firstInvalid) {
                    firstInvalid.focus();
                }
                return;
            }

            success.textContent =
                "Registration successful! Your form is valid.";
            form.reset();
            updateForm();
        });

        updateForm();
    </script>
</body>

</html>
