<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Week 11 Challenge — Product Cards</title>
  <style>
    :root { font-family: Arial, Helvetica, sans-serif; color: #282b27; background: #f5f3ed; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 48px 20px; background: #f5f3ed; }
    main { width: min(1050px, 100%); margin: auto; }
    header { margin-bottom: 32px; text-align: center; }
    .eyebrow { color: #777b69; font-size: .75rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 8px 0; color: #252820; font-family: Georgia, 'Times New Roman', serif; font-size: clamp(2.4rem, 7vw, 4rem); }
    header p { color: #66695f; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr)); gap: 18px; }
    .product-card { overflow: hidden; border: 1px solid #dedbd1; border-radius: 12px; background: #fffefa; box-shadow: 0 5px 16px #3030200c; }
    .product-image { display: block; width: 100%; height: 210px; object-fit: cover; background: #e8e5dc; }
    .product-body { padding: 22px; }
    .product-body h2 { margin: 0; color: #282b27; font-family: Georgia, 'Times New Roman', serif; font-size: 1.35rem; }
    .product-price { margin: 10px 0; color: #34372f; font-size: 1.4rem; font-weight: 700; }
    .product-meta { display: flex; align-items: center; gap: 9px; margin: 12px 0 0; color: #66695f; font-size: .9rem; }
    .stars { color: #b47a2c; font-size: 1.1rem; }
    .stock { font-weight: 700; }
    .available { color: #527456; }
    .unavailable { color: #a25a4a; }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">Week 11 · Completed challenge</div>
      <h1>Product Cards</h1>
      <p>Product props drive the price, five-star rating, and stock status.</p>
    </header>
    <div id="root"></div>
  </main>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script>
    const h = React.createElement;

    function ProductCard({ name, price, rating, inStock, imageUrl }) {
      const safeRating = Number.isFinite(rating) ? Math.min(5, Math.max(0, rating)) : 0;
      const fullStars = Math.floor(safeRating);
      const halfStar = safeRating - fullStars >= 0.5;
      const emptyStars = 5 - fullStars - (halfStar ? 1 : 0);
      const stars = '★'.repeat(fullStars) + (halfStar ? '½' : '') + '☆'.repeat(emptyStars);
      const formattedPrice = new Intl.NumberFormat('ko-KR', {
        style: 'currency',
        currency: 'KRW',
        maximumFractionDigits: 0
      }).format(price);

      return h('article', { className: 'product-card' },
        h('img', { className: 'product-image', src: imageUrl, alt: name, loading: 'lazy', decoding: 'async' }),
        h('div', { className: 'product-body' },
          h('h2', null, name),
          h('p', { className: 'product-price' }, formattedPrice),
          h('p', { className: 'product-meta' },
            h('span', { className: 'stars', 'aria-hidden': 'true' }, stars),
            h('span', { 'aria-label': `${safeRating} out of 5 stars` }, `${safeRating.toFixed(1)} / 5 stars`)
          ),
          h('p', { className: `product-meta stock ${inStock ? 'available' : 'unavailable'}` },
            h('span', { 'aria-hidden': 'true' }, '●'),
            inStock ? 'In Stock' : 'Out of Stock'
          )
        )
      );
    }

    const products = [
      { id: 1, name: 'Wireless Earbuds', price: 89000, rating: 4.5, inStock: true, imageUrl: 'public/images/wireless-earbuds.jpg' },
      { id: 2, name: 'Mechanical Keyboard', price: 124000, rating: 4.8, inStock: false, imageUrl: 'public/images/mechanical-keyboard.jpg' },
      { id: 3, name: 'Bluetooth Speaker', price: 67000, rating: 4, inStock: true, imageUrl: 'public/images/bluetooth-speaker.jpg' }
    ];

    function App() {
      return h('section', { className: 'product-grid', 'aria-label': 'Product examples' },
        products.map((product) => h(ProductCard, { key: product.id, ...product }))
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
</html>
