<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Step 2 — CSS Layout &amp; Cards</title>

    <!--
  ╔══════════════════════════════════════════════════════╗
  ║  STEP 2 — CSS: Layout & Cards                       ║
  ║                                                      ║
  ║  The HTML below is complete (from Step 1).          ║
  ║  YOUR TASK: write CSS inside the <style> tag below  ║
  ║  so the page looks like a real app.                 ║
  ║                                                      ║
  ║  Requirements (use CSS custom properties!):         ║
  ║                                                      ║
  ║  :root variables to define:                         ║
  ║    --dark   #1a2540                                 ║
  ║    --accent #1a56db                                 ║
  ║    --bg     #f0f4ff                                 ║
  ║    --surf   #ffffff                                 ║
  ║    --border #c8d4f0                                 ║
  ║    --text   #1a2340                                 ║
  ║    --muted  #5a6a8a                                 ║
  ║                                                      ║
  ║  header:                                            ║
  ║    - background: var(--dark), text-align center     ║
  ║    - padding: 32px                                  ║
  ║    - h1 color: white                                ║
  ║    - p color: #94a3b8                               ║
  ║                                                      ║
  ║  body: background var(--bg), font Inter/sans-serif  ║
  ║                                                      ║
  ║  #search-section:                                   ║
  ║    - max-width 600px, margin 32px auto              ║
  ║    - form: display flex, gap 10px                   ║
  ║    - input: flex 1, padding 12px 16px,              ║
  ║             border 1px solid var(--border),         ║
  ║             border-radius 8px, font-size 16px       ║
  ║    - button: background var(--accent), color white, ║
  ║              border none, padding 12px 24px,        ║
  ║              border-radius 8px, cursor pointer      ║
  ║              transition background .2s              ║
  ║              hover: background #1447b3              ║
  ║                                                      ║
  ║  #results-section:                                  ║
  ║    - max-width 1000px, margin 0 auto, padding 24px  ║
  ║                                                      ║
  ║  #results-grid:                                     ║
  ║    - display grid                                   ║
  ║    - grid-template-columns repeat(auto-fill,        ║
  ║        minmax(180px, 1fr))                          ║
  ║    - gap 20px, margin-top 20px                     ║
  ║                                                      ║
  ║  .book-card  (JS will create these elements):       ║
  ║    - background var(--surf)                         ║
  ║    - border 1px solid var(--border)                 ║
  ║    - border-radius 10px, overflow hidden            ║
  ║    - transition transform .15s, box-shadow .15s     ║
  ║    - hover: translateY(-4px) + shadow               ║
  ║    - img inside: width 100%, display block          ║
  ║    - .card-body: padding 12px                       ║
  ║    - h3 inside: font-size 14px, font-weight 700,   ║
  ║                 line-height 1.4                     ║
  ║    - p inside: font-size 12px, color var(--muted),  ║
  ║               margin-top 4px                        ║
  ║                                                      ║
  ║  DONE? Open in browser — page should look styled.  ║
  ║  The card styles will be visible after Step 5.     ║
  ╚══════════════════════════════════════════════════════╝
-->

    <style>
        :root {
            --dark: #1a2540;
            --accent: #1a56db;
            --bg: #f0f4ff;
            --surf: #ffffff;
            --border: #c8d4f0;
            --text: #1a2340;
            --muted: #5a6a8a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Inter, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        header {
            background: var(--dark);
            text-align: center;
            padding: 32px;
        }

        header h1 {
            color: white;
            margin-bottom: 8px;
        }

        header p {
            color: #94a3b8;
        }

        #search-section {
            max-width: 600px;
            margin: 32px auto;
            padding: 0 20px;
        }

        #search-form {
            display: flex;
            gap: 10px;
        }

        #search-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            min-width: 0;
        }

        #search-form button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #search-form button:hover {
            background: #1447b3;
        }

        #results-section {
            max-width: 1000px;
            margin: 0 auto;
            padding: 24px;
        }

        #results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .book-card {
            background: var(--surf);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .book-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(26, 37, 64, 0.12);
        }

        .book-card img {
            width: 100%;
            display: block;
        }

        .card-body {
            padding: 12px;
        }

        .card-body h3 {
            font-size: 14px;
            font-weight: 700;
            line-height: 1.4;
        }

        .card-body p {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px;
        }
    </style>
</head>

<body>

    <header>
        <h1>📚 Book Search</h1>
        <p>Search the Open Library — millions of books, free</p>
    </header>

    <main>
        <section id="search-section">
            <form id="search-form">
                <input type="text" id="search-input" placeholder="Search books…" required>
                <button type="submit">Search</button>
            </form>
        </section>

        <section id="results-section">
            <h2>Results</h2>
            <div id="results-grid">
                <!-- JS will populate this — for now add a sample card to check your styles -->
                <div class="book-card">
                    <img src="https://covers.openlibrary.org/b/id/8091016-M.jpg" alt="Sample cover">
                    <div class="card-body">
                        <h3>The Great Gatsby</h3>
                        <p>F. Scott Fitzgerald · 1925</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

</body>

</html>
