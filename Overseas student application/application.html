<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overseas Student Application</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff;
            color: #0f172a;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px 60px;
        }

        .container {
            width: 100%;
            max-width: 960px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 24px;
            text-align: center;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.8rem, 3.5vw, 2.5rem);
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.02em;
        }

        .video-box {
            width: 100%;
            background: #000000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
            aspect-ratio: 16 / 9;
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
        }

        .slides-link {
            display: block;
            width: fit-content;
            margin: 24px auto 0;
            color: #2563eb;
            font-weight: 600;
            text-decoration: none;
        }

        .slides-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Overseas Student Application</h1>
        </header>

        <div class="video-box">
            <video controls controlslist="nodownload" preload="metadata">
                <source src="Done.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <a class="slides-link"
            href="https://docs.google.com/presentation/d/1khGxsIZzqmhDyjVWIjlqIu3b_gZl0c_6/edit?usp=sharing&amp;ouid=115314268666553371083&amp;rtpof=true&amp;sd=true"
            target="_blank" rel="noopener noreferrer">View the presentation slides</a>
    </div>
</body>

</html>
