<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API - Random Joke</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            padding: 24px;
            background: #f1f5f9;
            border-radius: 12px;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
        }

        #status {
            color: #555;
        }

        #punchline {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>Random Joke Generator</h1>
    <p>Click the button to request a joke from an API.</p>

    <div class="card">
        <p id="status">Ready to load a joke.</p>
        <h2 id="setup"></h2>
        <p id="punchline"></p>
        <button id="load-btn" type="button">Load a Joke</button>
    </div>

    <script>
        const button = document.getElementById("load-btn");
        const status = document.getElementById("status");
        const setup = document.getElementById("setup");
        const punchline = document.getElementById("punchline");

        async function loadJoke() {
            button.disabled = true;
            status.textContent = "Loading joke...";
            setup.textContent = "";
            punchline.textContent = "";

            try {
                const response = await fetch(
                    "https://official-joke-api.appspot.com/random_joke"
                );

                if (!response.ok) {
                    throw new Error("Could not load the joke.");
                }

                const joke = await response.json();
                setup.textContent = joke.setup;
                punchline.textContent = joke.punchline;
                status.textContent = "Here is your joke!";
            } catch (error) {
                status.textContent = "Error: " + error.message;
            } finally {
                button.disabled = false;
            }
        }

        button.addEventListener("click", loadJoke);
    </script>
</body>

</html>
