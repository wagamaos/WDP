<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page Not Found</title>
  <style>
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 24px; background: #f6f4fb; color: #1e293b; font: 16px/1.6 system-ui, sans-serif; text-align: center; }
    main { max-width: 520px; padding: 40px; border: 1px solid #e4dff0; border-radius: 20px; background: white; }
    .code { color: #7c3aed; font-size: .9rem; font-weight: 800; letter-spacing: .15em; }
    h1 { margin: 10px 0; font-size: clamp(2rem, 8vw, 3.5rem); }
    p { color: #526174; }
    a { display: inline-block; margin-top: 12px; padding: 12px 18px; border-radius: 10px; background: #7c3aed; color: white; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid #c4b5fd; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="code">ERROR 404</div>
    <h1>We couldn't find that page.</h1>
    <p>The address may be outdated, or the page may have moved. Head back to the homepage and try again.</p>
    <a href="./">Return to the homepage</a>
  </main>
</body>
</html>
