<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Step 5 — Render: Display the Cards</title>
    <style>
        :root {
            --dark: #1a2540;
            --accent: #1a56db;
            --bg: #f0f4ff;
            --surf: #fff;
            --border: #c8d4f0;
            --text: #1a2340;
            --muted: #5a6a8a;
            --red: #dc2626;
            --redl: #fee2e2
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: Inter, sans-serif;
            background: var(--bg);
            color: var(--text)
        }

        header {
            background: var(--dark);
            padding: 32px;
            text-align: center
        }

        header h1 {
            color: #fff;
            font-size: 24px;
            font-weight: 800
        }

        header p {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 6px
        }

        #search-section {
            max-width: 600px;
            margin: 32px auto;
            padding: 0 20px
        }

        form {
            display: flex;
            gap: 10px
        }

        input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit
        }

        button {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s
        }

        button:hover {
            background: #1447b3
        }

        #results-section {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px 60px
        }

        #results-section h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px
        }

        #status {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 16px
        }

        #status.error {
            color: var(--red)
        }

        #results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
            gap: 18px
        }

        .book-card {
            background: var(--surf);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            transition: transform .15s, box-shadow .15s;
            cursor: pointer
        }

        .book-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 28px rgba(26, 37, 64, .14)
        }

        .book-card img {
            width: 100%;
            display: block;
            aspect-ratio: 2/3;
            object-fit: cover;
            background: #e2e8f0
        }

        .book-card .no-cover {
            width: 100%;
            aspect-ratio: 2/3;
            background: linear-gradient(135deg, #e2e8f0, #c8d4f0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px
        }

        .card-body {
            padding: 10px 12px 14px
        }

        .card-body h3 {
            font-size: 13px;
            font-weight: 700;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden
        }

        .card-body p {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }
    </style>
</head>

<body>

    <header>
        <h1>📚 Book Search</h1>
        <p>Search the Open Library — millions of books, free</p>
    </header>

    <main>
        <section id="search-section">
            <form id="search-form">
                <input type="text" id="search-input" placeholder="Search books…" required>
                <button type="submit">Search</button>
            </form>
        </section>

        <section id="results-section">
            <h2>Results</h2>
            <p id="status">Type a title or author above and press Search.</p>
            <div id="results-grid"></div>
        </section>
    </main>

    <script>
        /*
          ╔══════════════════════════════════════════════════════╗
          ║  STEP 5 — Render: Display the Cards                 ║
          ║                                                      ║
          ║  The fetch code from Step 4 is done for you below.  ║
          ║  Review how renderResults() creates each book card.║
          ║                                                      ║
          ║  renderResults(books) receives an array of book     ║
          ║  objects. For each book it:                         ║
          ║                                                      ║
          ║  1. Clears the grid with replaceChildren().         ║
          ║                                                      ║
          ║  2. Loops through the books and creates a card.     ║
          ║                                                      ║
          ║  3. Creates an image or a no-cover placeholder.     ║
          ║                                                      ║
          ║  4. Adds title and author details using textContent. ║
          ║                                                      ║
          ║  5. Appends the completed card to the grid.         ║
          ║                                                      ║
          ║  DONE? Search "Harry Potter" — you should see a    ║
          ║  grid of book covers with titles and authors.       ║
          ║                                                      ║
          ║  ── IMPORTANT SECURITY NOTE ─────────────────────  ║
          ║  Book details are inserted with textContent, which ║
          ║  treats API values as text instead of HTML.        ║
          ║  This avoids interpreting returned strings as     ║
          ║  markup.                                            ║
          ╚══════════════════════════════════════════════════════╝
        */

        const form = document.getElementById('search-form');
        const input = document.getElementById('search-input');
        const status = document.getElementById('status');
        const grid = document.getElementById('results-grid');

        function renderResults(books) {
            grid.replaceChildren();

            books.forEach(book => {
                const card = document.createElement('article');
                card.className = 'book-card';

                if (book.cover_i) {
                    const cover = document.createElement('img');
                    cover.src = 'https://covers.openlibrary.org/b/id/'
                        + encodeURIComponent(book.cover_i) + '-M.jpg';
                    cover.alt = 'Cover of ' + (book.title || 'book');
                    cover.loading = 'lazy';
                    card.appendChild(cover);
                } else {
                    const noCover = document.createElement('div');
                    noCover.className = 'no-cover';
                    noCover.textContent = '📚';
                    noCover.setAttribute('aria-label', 'No cover available');
                    card.appendChild(noCover);
                }

                const body = document.createElement('div');
                body.className = 'card-body';

                const title = document.createElement('h3');
                title.textContent = book.title || 'Unknown title';
                body.appendChild(title);

                const details = document.createElement('p');
                const author = Array.isArray(book.author_name) && book.author_name.length
                    ? book.author_name[0]
                    : 'Unknown author';
                const year = book.first_publish_year || '';
                details.textContent = author + (year ? ' · ' + year : '');
                body.appendChild(details);

                card.appendChild(body);
                grid.appendChild(card);
            });
        }

        async function searchBooks(query) {
            status.className = '';
            status.textContent = 'Searching…';
            grid.replaceChildren();

            try {
                const url = 'https://openlibrary.org/search.json?q='
                    + encodeURIComponent(query) + '&limit=12';
                const res = await fetch(url);
                if (!res.ok) throw new Error('Server error: ' + res.status);
                const data = await res.json();

                if (!Array.isArray(data.docs)) {
                    throw new Error('The book service returned an unexpected response.');
                }
                if (data.docs.length === 0) {
                    status.textContent = 'No books found for "' + query + '"';
                    return;
                }

                status.textContent = 'Showing ' + data.docs.length
                    + ' of ' + data.numFound + ' results for "'
                    + query + '"';

                renderResults(data.docs);  // ← calls your function

            } catch (err) {
                status.className = 'error';
                status.textContent = '⚠ ' + err.message;
            }
        }

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            const query = input.value.trim();
            if (!query) return;
            searchBooks(query);
        });
    </script>
</body>

</html>
