<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Form Validation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 450px;
            margin: 40px auto;
            padding: 20px;
        }

        label {
            display: block;
            margin-top: 18px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 6px;
            border: 2px solid #bdbdbd;
            border-radius: 5px;
        }

        /* Blue outline when the field is focused */
        input:focus {
            outline: 3px solid #93c5fd;
            border-color: #2563eb;
        }

        /* Red for invalid fields after the placeholder disappears */
        input:invalid:not(:placeholder-shown) {
            border-color: #dc2626;
            background-color: #fef2f2;
        }

        /* Green for valid fields after the placeholder disappears */
        input:valid:not(:placeholder-shown) {
            border-color: #16a34a;
            background-color: #f0fdf4;
        }

        button {
            margin-top: 20px;
            padding: 10px 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Validation Practice</h1>
    <p>Enter different values to see the border colours change.</p>

    <form action="#" method="get">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter a valid email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 8 characters" minlength="8" required>

        <label for="student-id">Student ID</label>
        <input type="text" id="student-id" name="student_id" placeholder="9-digit student ID" pattern="\d{9}"
            title="Enter exactly 9 digits" required>

        <button type="submit">Check Fields</button>
        <button type="reset">Reset</button>
    </form>

    <h2>Colour Guide</h2>
    <ul>
        <li>Green: valid value.</li>
        <li>Red: invalid value after typing.</li>
        <li>Blue: field currently has focus.</li>
        <li>Grey: untouched empty field.</li>
    </ul>
</body>

</html>
