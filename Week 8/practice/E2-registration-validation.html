<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
</head>

<body>
    <h1>New Student Registration</h1>
    <p>Complete the details below.</p>

    <form action="#" method="get">
        <fieldset>
            <legend>Registration Details</legend>

            <label for="student-id">Student ID</label>
            <input type="text" id="student-id" name="student_id" pattern="\d{9}"
                title="Student ID must contain exactly 9 digits" placeholder="e.g. 123456789" required>
            <br><br>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="name@example.com" required>
            <br><br>

            <label for="password">Create Password</label>
            <input type="password" id="password" name="password" minlength="8" required>
            <br><br>

            <label for="age">Age</label>
            <input type="number" id="age" name="age" min="16" max="100" required>
            <br><br>

            <button type="submit">Register Account</button>
            <button type="reset">Clear Form</button>
        </fieldset>
    </form>
</body>

</html>
