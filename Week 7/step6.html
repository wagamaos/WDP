<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Step 6 — Bonus: Loading &amp; Errors</title>
    <style>
        :root {
            --dark: #1a2540;
            --accent: #1a56db;
            --bg: #f0f4ff;
            --surf: #fff;
            --border: #c8d4f0;
            --text: #1a2340;
            --muted: #5a6a8a;
            --red: #dc2626;
            --redl: #fee2e2;
            --yellow: #f59e0b
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: Inter, sans-serif;
            background: var(--bg);
            color: var(--text)
        }

        header {
            background: var(--dark);
            padding: 32px;
            text-align: center
        }

        header h1 {
            color: #fff;
            font-size: 24px;
            font-weight: 800
        }

        header p {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 6px
        }

        #search-section {
            max-width: 600px;
            margin: 32px auto;
            padding: 0 20px
        }

        form {
            display: flex;
            gap: 10px
        }

        input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit
        }

        button {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s;
            display: flex;
            align-items: center;
            gap: 8px
        }

        button:hover:not(:disabled) {
            background: #1447b3
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed
        }

        #results-section {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px 60px
        }

        #results-section h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px
        }

        /* ── Status bar ── */
        #status {
            font-size: 13px;
            margin-bottom: 16px;
            padding: 10px 14px;
            border-radius: 8px;
            display: none
        }

        #status.info {
            display: block;
            background: var(--surf);
            border: 1px solid var(--border);
            color: var(--muted)
        }

        #status.error {
            display: block;
            background: var(--redl);
            border: 1px solid var(--red);
            color: var(--red)
        }

        #status.empty {
            display: block;
            background: #fefce8;
            border: 1px solid var(--yellow);
            color: #92400e
        }

        /* ── Spinner ── */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, .4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        /* ── Card grid ── */
        #results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
            gap: 18px
        }

        .book-card {
            background: var(--surf);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            transition: transform .15s, box-shadow .15s
        }

        .book-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 28px rgba(26, 37, 64, .14)
        }

        .book-card img {
            width: 100%;
            display: block;
            aspect-ratio: 2/3;
            object-fit: cover;
            background: #e2e8f0
        }

        .book-card .no-cover {
            width: 100%;
            aspect-ratio: 2/3;
            background: linear-gradient(135deg, #e2e8f0, #c8d4f0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px
        }

        .card-body {
            padding: 10px 12px 14px
        }

        .card-body h3 {
            font-size: 13px;
            font-weight: 700;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden
        }

        .card-body p {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        /* ── Skeleton cards while loading ── */
        .skeleton {
            background: var(--surf);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            animation: pulse 1.4s ease-in-out infinite
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .4
            }
        }

        .skeleton-img {
            width: 100%;
            aspect-ratio: 2/3;
            background: #e2e8f0
        }

        .skeleton-body {
            padding: 10px 12px 14px
        }

        .skeleton-line {
            height: 12px;
            background: #e2e8f0;
            border-radius: 4px;
            margin-bottom: 8px
        }

        .skeleton-line.short {
            width: 60%
        }
    </style>
</head>

<body>

    <header>
        <h1>📚 Book Search</h1>
        <p>Search the Open Library — millions of books, free</p>
    </header>

    <main>
        <section id="search-section">
            <form id="search-form">
                <input type="text" id="search-input" placeholder="Search books…" required>
                <button id="search-btn" type="submit">Search</button>
            </form>
        </section>

        <section id="results-section">
            <h2>Results</h2>
            <div id="status"></div>
            <div id="results-grid"></div>
        </section>
    </main>

    <script>
        /*
          ╔══════════════════════════════════════════════════════╗
          ║  STEP 6 — BONUS: Loading State & Error Handling     ║
          ║                                                      ║
          ║  Steps 1–5 are combined and working below.          ║
          ║  YOUR TASK: improve the user experience.            ║
          ║                                                      ║
          ║  A) Show skeleton cards while loading:              ║
          ║     In showSkeletons() below, add code to:          ║
          ║       grid.innerHTML = '';                           ║
          ║       for (let i = 0; i < 6; i++) {                 ║
          ║         const sk = document.createElement('div');   ║
          ║         sk.className = 'skeleton';                  ║
          ║         sk.innerHTML =                              ║
          ║           '<div class="skeleton-img"></div>' +      ║
          ║           '<div class="skeleton-body">' +           ║
          ║           '<div class="skeleton-line"></div>' +     ║
          ║           '<div class="skeleton-line short"></div>' +
          ║           '</div>';                                 ║
          ║         grid.appendChild(sk);                       ║
          ║       }                                             ║
          ║                                                      ║
          ║  B) Disable the button during fetch:                ║
          ║     In searchBooks():                               ║
          ║       btn.disabled = true;                          ║
          ║       btn.innerHTML = '<span class="spinner"></span> Searching…';
          ║     In the finally block:                           ║
          ║       btn.disabled = false;                         ║
          ║       btn.textContent = 'Search';                   ║
          ║                                                      ║
          ║  C) Show a friendly empty state:                    ║
          ║     If data.docs.length === 0:                      ║
          ║       setStatus('empty', '📭 No books found for "'  ║
          ║                        + query + '" — try another query'); ║
          ║       grid.innerHTML = '';   // clear skeletons     ║
          ║       return;                                       ║
          ║                                                      ║
          ║  DONE?  Try these:                                  ║
          ║   · Search "dune" — skeletons appear, then cards    ║
          ║   · Disconnect wifi and search — error message      ║
          ║   · Search "xzxzxz" — empty state message          ║
          ╚══════════════════════════════════════════════════════╝
        */

        const form = document.getElementById('search-form');
        const input = document.getElementById('search-input');
        const status = document.getElementById('status');
        const grid = document.getElementById('results-grid');
        const btn = document.getElementById('search-btn');

        function setStatus(type, msg) {
            status.className = type;
            status.textContent = msg;
        }

        function showSkeletons() {
            grid.replaceChildren();
            for (let i = 0; i < 6; i++) {
                const skeleton = document.createElement('div');
                skeleton.className = 'skeleton';
                skeleton.setAttribute('aria-hidden', 'true');
                skeleton.innerHTML =
                    '<div class="skeleton-img"></div>' +
                    '<div class="skeleton-body">' +
                    '<div class="skeleton-line"></div>' +
                    '<div class="skeleton-line short"></div>' +
                    '</div>';
                grid.appendChild(skeleton);
            }
        }

        function renderResults(books) {
            grid.replaceChildren();
            books.forEach(book => {
                const card = document.createElement('article');
                card.className = 'book-card';

                if (book.cover_i) {
                    const cover = document.createElement('img');
                    cover.src = 'https://covers.openlibrary.org/b/id/'
                        + encodeURIComponent(book.cover_i) + '-M.jpg';
                    cover.alt = 'Cover of ' + (book.title || 'book');
                    cover.loading = 'lazy';
                    card.appendChild(cover);
                } else {
                    const noCover = document.createElement('div');
                    noCover.className = 'no-cover';
                    noCover.textContent = '📚';
                    noCover.setAttribute('aria-label', 'No cover available');
                    card.appendChild(noCover);
                }

                const body = document.createElement('div');
                body.className = 'card-body';
                const title = document.createElement('h3');
                title.textContent = book.title || 'Unknown title';
                body.appendChild(title);

                const details = document.createElement('p');
                const author = Array.isArray(book.author_name) && book.author_name.length
                    ? book.author_name[0]
                    : 'Unknown author';
                const year = book.first_publish_year || '';
                details.textContent = author + (year ? ' · ' + year : '');
                body.appendChild(details);

                card.appendChild(body);
                grid.appendChild(card);
            });
        }

        async function searchBooks(query) {
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner" aria-hidden="true"></span> Searching…';
            showSkeletons();
            setStatus('info', 'Searching…');

            try {
                const url = 'https://openlibrary.org/search.json?q='
                    + encodeURIComponent(query) + '&limit=12';
                const res = await fetch(url);
                if (!res.ok) throw new Error('Server error ' + res.status);
                const data = await res.json();

                if (!Array.isArray(data.docs)) {
                    throw new Error('The book service returned an unexpected response.');
                }
                if (data.docs.length === 0) {
                    grid.replaceChildren();
                    setStatus('empty', '📭 No books found for "' + query + '" — try another query.');
                    return;
                }

                setStatus('info', 'Showing ' + data.docs.length
                    + ' of ' + data.numFound + ' results for "' + query + '"');
                renderResults(data.docs);

            } catch (err) {
                grid.replaceChildren();
                const message = err instanceof Error ? err.message : 'Unknown error';
                setStatus('error', '⚠ ' + message
                    + ' — check your internet connection and try again.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Search';
            }
        }

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            if (btn.disabled) return;
            const query = input.value.trim();
            if (!query) return;
            searchBooks(query);
        });
    </script>
</body>

</html>
