<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Week 11 — Completed React Components Practice</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; color: #e5e7eb; background: #0b1020; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 48px 20px; background: radial-gradient(ellipse at 18% 0%, #312e8170, transparent 38rem), #0b1020; }
    main { width: min(940px, 100%); margin: auto; }
    header { margin-bottom: 30px; }
    .eyebrow { color: #a5b4fc; font-size: .75rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 8px 0; color: #fff; font-size: clamp(2rem, 6vw, 3.5rem); letter-spacing: -.05em; }
    header p, .card p { color: #a5afc3; }
    .exercise-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .profile-card, .content-card { border: 1px solid #bae6fd50; border-radius: 14px; background: #111827e8; }
    .profile-card { display: flex; align-items: center; gap: 16px; padding: 20px; }
    .profile-card img { width: 80px; height: 80px; border: 2px solid #818cf866; border-radius: 50%; object-fit: cover; }
    .profile-card h2, .content-card h2 { margin: 0 0 8px; color: #f8fafc; font-size: 1.15rem; }
    .profile-card p, .content-card p { margin: 0 0 8px; }
    a { color: #c7d2fe; text-underline-offset: 3px; }
    .content-card { min-height: 150px; padding: 20px; }
    .content-card ul { margin: 0; padding-left: 20px; color: #cbd5e1; }
    .notification-list { display: grid; gap: 9px; margin: 0; padding: 0; list-style: none; }
    .notification { display: flex; gap: 10px; padding: 10px; border: 1px solid #ffffff20; border-radius: 9px; color: #dbeafe; }
    .notification--success { border-color: #34d39955; background: #10b98116; }
    .notification--warning { border-color: #fbbf2455; background: #f59e0b16; }
    .notification--info { border-color: #60a5fa55; background: #3b82f616; }
    .result { margin-top: 20px; color: #8793aa; font-size: .86rem; }
    @media (max-width: 640px) { .exercise-grid { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">Week 11 · Completed React practice</div>
      <h1>Components &amp; Props</h1>
      <p>These are rendered React components: a profile with a default avatar, typed notifications, and reusable cards that accept children.</p>
    </header>
    <div id="exercise-root"></div>
    <p class="result">The matching component source is also used in <code>portfolio-gallery/src/components</code>.</p>
  </main>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script>
    const h = React.createElement;

    function ProfileCard({
      name,
      role,
      email,
      avatarUrl = 'https://via.placeholder.com/80'
    }) {
      return h('article', { className: 'profile-card' },
        h('img', { src: avatarUrl, alt: name }),
        h('div', null,
          h('h2', null, name),
          h('p', null, role),
          h('a', { href: `mailto:${email}` }, email)
        )
      );
    }

    const notifications = [
      { id: 1, type: 'success', message: 'Profile updated successfully' },
      { id: 2, type: 'warning', message: 'Password expires in 3 days' },
      { id: 3, type: 'info', message: 'New lecture materials available' }
    ];

    function NotificationItem({ type, message }) {
      const icon = type === 'success' ? '✅' : type === 'warning' ? '⚠️' : 'ℹ️';
      const label = type === 'success' ? 'Success' : type === 'warning' ? 'Warning' : 'Information';
      return h('li', { className: `notification notification--${type}` },
        h('span', { role: 'img', 'aria-label': label }, icon),
        h('span', null, message)
      );
    }

    function NotificationList() {
      return h('ul', { className: 'notification-list' },
        notifications.map((item) => h(NotificationItem, {
          key: item.id,
          type: item.type,
          message: item.message
        }))
      );
    }

    function Card({ title, children }) {
      return h('section', { className: 'content-card' },
        h('h2', null, title),
        children
      );
    }

    function ExerciseResults() {
      return h('div', { className: 'exercise-grid' },
        h(ProfileCard, {
          name: 'Dr. Toshpulatov',
          role: 'Professor',
          email: 'muhiddin@gachon.ac.kr'
        }),
        h(Card, { title: 'Lecture Topics' },
          h('ul', null,
            h('li', null, 'Components'),
            h('li', null, 'Props')
          )
        ),
        h(Card, { title: 'Homework' },
          h('p', null, 'Build a student portfolio component.')
        ),
        h(Card, { title: 'Notifications' }, h(NotificationList))
      );
    }

    ReactDOM.createRoot(document.getElementById('exercise-root'))
      .render(h(ExerciseResults));
  </script>
</body>
</html>
