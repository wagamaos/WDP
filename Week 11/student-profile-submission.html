<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Week 11 — Student Profile Submission</title>
  <style>
    :root {
      color: #e5e7eb;
      background: #111827;
      font: 16px/1.6 system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      background: radial-gradient(ellipse at 16% 0%, #312e8170, transparent 38rem), #111827;
    }

    main { width: min(1100px, 100%); margin: 0 auto; }

    a { color: #c7d2fe; text-underline-offset: 3px; }

    .eyebrow {
      margin: 0 0 8px;
      color: #a5b4fc;
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    h1 { margin: 0; color: #fff; font-size: clamp(2rem, 6vw, 3.4rem); line-height: 1.15; }

    .intro { margin: 12px 0 26px; color: #a5afc3; }

    .submission-code {
      display: inline-block;
      margin-bottom: 22px;
      border: 1px solid #818cf866;
      border-radius: 12px;
      padding: 12px 18px;
      background: #312e8140;
      color: #e0e7ff;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: .08em;
    }

    figure {
      margin: 0;
      overflow: hidden;
      border: 1px solid #ffffff24;
      border-radius: 16px;
      background: #1f2937;
      box-shadow: 0 20px 60px #0005;
    }

    img { display: block; width: 100%; height: auto; }

    figcaption { padding: 14px 18px; color: #a5afc3; font-size: .9rem; }

    .back-link { display: inline-block; margin-top: 24px; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Week 11 · Student profile card</p>
    <h1>Submission Check</h1>
    <p class="intro">The screenshot below records the successful code check for the StudentProfileCard assignment.</p>
    <div class="submission-code" aria-label="Submission code">9474-BBB-9881</div>
    <figure>
      <img src="images/student-profile-check.png" alt="Screenshot showing all seven StudentProfileCard self-check items passed">
      <figcaption>Student Profile Card self-check — 7 of 7 items passed.</figcaption>
    </figure>
    <a class="back-link" href="index.html">Back to Week 11 pages</a>
  </main>
</body>
</html>
