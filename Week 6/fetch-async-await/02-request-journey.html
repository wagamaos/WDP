<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How Fetch Works</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 40px auto;
            padding: 20px;
        }

        .stage {
            padding: 16px;
            margin: 12px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
        }

        .active {
            border-color: #2563eb;
            background: #eff6ff;
        }

        button {
            padding: 10px 16px;
            cursor: pointer;
        }

        #status {
            min-height: 24px;
        }
    </style>
</head>

<body>
    <h1>The Fetch Request Journey</h1>
    <p>A request travels from the browser to a server and back.</p>

    <div class="stage" id="stage1">1. Browser sends a request</div>
    <div class="stage" id="stage2">2. Server processes the request</div>
    <div class="stage" id="stage3">3. Response data arrives</div>
    <div class="stage" id="stage4">4. Browser updates the page</div>

    <button id="play" type="button">Start Journey</button>
    <p id="status" aria-live="polite">Click to begin.</p>
    <p id="result"></p>

    <script>
        const stages = [
            document.getElementById("stage1"),
            document.getElementById("stage2"),
            document.getElementById("stage3"),
            document.getElementById("stage4")
        ];

        const status = document.getElementById("status");
        const result = document.getElementById("result");
        const button = document.getElementById("play");

        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function playJourney() {
            button.disabled = true;
            result.textContent = "";
            stages.forEach(stage => stage.classList.remove("active"));

            try {
                status.textContent = "Sending request...";
                stages[0].classList.add("active");
                await delay(500);

                status.textContent = "Contacting the joke server...";
                stages[0].classList.remove("active");
                stages[1].classList.add("active");

                const response = await fetch(
                    "https://official-joke-api.appspot.com/random_joke"
                );

                if (!response.ok) {
                    throw new Error("Server returned " + response.status);
                }

                await delay(300);
                status.textContent = "Response received!";
                stages[1].classList.remove("active");
                stages[2].classList.add("active");

                const data = await response.json();

                await delay(300);
                stages[2].classList.remove("active");
                stages[3].classList.add("active");
                result.textContent = data.setup + " — " + data.punchline;
                status.textContent = "Journey complete!";
            } catch (error) {
                status.textContent = "Request failed: " + error.message;
            } finally {
                button.disabled = false;
            }
        }

        button.addEventListener("click", playJourney);
    </script>
</body>

</html>
