<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async and Await</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 40px auto;
            padding: 20px;
        }

        button {
            padding: 10px 16px;
            margin-right: 8px;
            cursor: pointer;
        }

        pre {
            padding: 16px;
            background: #f3f4f6;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>
    <h1>Async / Await</h1>
    <p>Click either button to request a user from the server.</p>

    <button id="modern" type="button">Use Async/Await</button>
    <button id="promise" type="button">Use .then()</button>
    <p id="status" aria-live="polite">Ready.</p>
    <pre id="output"></pre>

    <script>
        const status = document.getElementById("status");
        const output = document.getElementById("output");

        async function loadUser() {
            status.textContent = "Loading user...";
            output.textContent = "";

            try {
                const response = await fetch(
                    "https://jsonplaceholder.typicode.com/users/1"
                );

                if (!response.ok) {
                    throw new Error("HTTP " + response.status);
                }

                const user = await response.json();

                output.textContent =
                    "Name: " + user.name + "\n" +
                    "Email: " + user.email;
                status.textContent = "User loaded!";
            } catch (error) {
                status.textContent = "Error: " + error.message;
            }
        }

        function loadUserWithThen() {
            status.textContent = "Loading user...";
            output.textContent = "";

            fetch("https://jsonplaceholder.typicode.com/users/1")
                .then(response => {
                    if (!response.ok) {
                        throw new Error("HTTP " + response.status);
                    }
                    return response.json();
                })
                .then(user => {
                    output.textContent =
                        "Name: " + user.name + "\n" +
                        "Email: " + user.email;
                    status.textContent = "User loaded!";
                })
                .catch(error => {
                    status.textContent = "Error: " + error.message;
                });
        }

        document.getElementById("modern").addEventListener("click", loadUser);
        document.getElementById("promise").addEventListener("click", loadUserWithThen);
    </script>
</body>

</html>
